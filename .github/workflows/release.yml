name: Release

on:
  push:
    tags:
      - 'omc-v*'

permissions:
  contents: write
  statuses: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/omc-v}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --current --strip all
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Build
        uses: gradle/gradle-build-action@v3
        with:
          arguments: build
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Rename artifacts
        run: |
          VER="${{ steps.version.outputs.version }}"
          mkdir -p build/release
          cp build/libs/*-sources.jar \
            "build/release/open-minecolonies-${VER}-sources.jar"
          MAIN=$(ls build/libs/*.jar | grep -v -- '-sources' | grep -v -- '-javadoc' | head -1)
          cp "$MAIN" "build/release/open-minecolonies-${VER}.jar"

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1548755
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          files: build/release/open-minecolonies-${{ steps.version.outputs.version }}-sources.jar

          name: open-minecolonies ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          java: 21
          loaders: |
            neoforge
          game-versions: |
            1.21.1
          changelog-file: RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-tag: ${{ github.ref }}
          github-draft: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            build/release/open-minecolonies-${{ steps.version.outputs.version }}.jar
            build/release/open-minecolonies-${{ steps.version.outputs.version }}-sources.jar

          name: open-minecolonies ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          java: 21
          loaders: |
            neoforge
          game-versions: |
            1.21.1
          changelog-file: RELEASE_NOTES.md
