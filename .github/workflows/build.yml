name: Build

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ open-minecol/version/1.21 ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Get version
        id: version
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          echo "version=${TAG#omc-v}" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: gradle/gradle-build-action@v3
        with:
          arguments: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
